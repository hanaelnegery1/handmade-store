<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tulip" viewBox="0 0 40 80">
    <path d="M20 30c-10-2-13-12-12-20 6 2 8 4 12 8 4-4 6-6 12-8 1 8-2 18-12 20zM20 30v46M20 56c-6-2-10-8-10-14M20 62c6-2 9-6 10-12"
      fill="none" stroke="#3a2b2c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<main class="shop" id="shop">
  <h2 appReveal>اللي صنعناه بإيدينا</h2>
  <p class="sub" appReveal>كل قطعة بتتعمل لوحدها، ومفيش اتنين زي بعض</p>

  <div class="tabs" appReveal>
    @for (t of tabs; track t) {
      <button type="button" [class.on]="cat() === t" (click)="cat.set(t)">{{ t }}</button>
    }
  </div>

  <div class="grid">
    @for (p of items(); track p.key) {
      <article class="card pop" [style.animation-delay.ms]="p.delay">
        <div class="pic" [style.--g]="p.grad">
          @if (p.img) {
            <img [src]="p.img" [alt]="p.name">
          } @else {
            <svg><use href="#tulip"/></svg>
          }
        </div>
        <h3>{{ p.name }}</h3>
        <small>{{ p.desc }}</small>
        <span class="price">{{ p.price }} جنيه</span>
        <a class="order" [href]="p.wa" target="_blank" rel="noopener">اطلبي دلوقتي</a>
      </article>
    }
  </div>
</main>
